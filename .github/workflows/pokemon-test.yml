name: Pokémon lagertest (torrkörning)
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          import pokemon_stock as s
          for fn in (s.dragonslair, s.alphaspel):
              items = fn()
              print(fn.__name__, len(items), "st, köpbara:", sum(i["ok"] for i in items))
              for i in items[:12]: print("  ", "JA " if i["ok"] else "-- ", i["price"], "|", i["title"][:70], "|", i["status"][:40])
          PY
