name: RSS till Discord
on:
  schedule:
    - cron: "17 * * * *"   # reserv om kedjan bryts
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: rss
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Kolla flöden var 5:e minut i ~5h45m
        env:
          WEBHOOK_EUROCOP: ${{ secrets.WEBHOOK_EUROCOP }}
          WEBHOOK_BT: ${{ secrets.WEBHOOK_BT }}
          WEBHOOK_POLISEN: ${{ secrets.WEBHOOK_POLISEN }}
          WEBHOOK_VALLENTUNA: ${{ secrets.WEBHOOK_VALLENTUNA }}
          WEBHOOK_ELFSBORG: ${{ secrets.WEBHOOK_ELFSBORG }}
        run: |
          git config user.name "rss-bot"; git config user.email "rss-bot@users.noreply.github.com"
          end=$((SECONDS + 345*60))
          while [ $SECONDS -lt $end ]; do
            git rebase --abort 2>/dev/null || true
            git fetch -q origin main && git reset -q --hard origin/main
            python bot.py || true
            git add seen.json
            if ! git diff --cached --quiet; then
              git commit -qm "uppdatera seen.json"
              git push -q || { git pull -q --rebase -X theirs origin main && git push -q; } || echo "push misslyckades"
            fi
            [ $((SECONDS + 300)) -lt $end ] || break
            sleep 300
          done
      - name: Starta nästa omgång
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run rss.yml -R ${{ github.repository }}
