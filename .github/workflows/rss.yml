name: RSS till Discord
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: rss
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python bot.py
        env:
          WEBHOOK_EUROCOP: ${{ secrets.WEBHOOK_EUROCOP }}
          WEBHOOK_BT: ${{ secrets.WEBHOOK_BT }}
      - name: Spara sedda
        run: |
          git config user.name "rss-bot"; git config user.email "rss-bot@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || (git commit -m "uppdatera seen.json" && git push)
